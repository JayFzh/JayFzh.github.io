{% if include.paper.links.size > 0 %}
<ul class="publication-links" aria-label="Resources for {{ include.paper.title | escape }}">
  {% for link in include.paper.links %}
  {% assign prefix = link.url | slice: 0, 1 %}
  <li>{% unless forloop.first %}<span aria-hidden="true">|</span> {% endunless %}<a href="{% if prefix == '/' %}{{ link.url | relative_url }}{% else %}{{ link.url }}{% endif %}">{{ link.label | escape }}</a></li>
  {% endfor %}
</ul>
{% else %}
<p class="publication-status">(Paper to be released)</p>
{% endif %}
